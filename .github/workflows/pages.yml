name: pages

# Publishes the demo page and the built bundle to GitHub Pages.
#
# The signaling server is NOT published here — it runs on Render (see
# render.yaml). Its URL comes from the SIGNALING_URL repository variable and is
# written into demo/config.js at publish time, so the committed copy stays
# empty and local runs keep defaulting to 127.0.0.1:8000.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To delete the artifacts a previous attempt of this same run left behind.
  actions: write

# Never cancel a run mid-publish — a half-deployed site is worse than a stale
# one. A newer push simply queues behind the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: { node-version: '22' }
      - run: cd widget && npm ci --no-audit --no-fund
      - run: cd widget && npm run build

      - name: assemble site
        env:
          SIGNALING_URL: ${{ vars.SIGNALING_URL }}
        run: |
          set -euo pipefail

          # Fail loudly rather than publish a demo pointing at 127.0.0.1, which
          # would look fine and connect to nothing.
          if [ -z "${SIGNALING_URL}" ]; then
            echo "::error::SIGNALING_URL repository variable is not set."
            echo "Set it to the Render service URL: gh variable set SIGNALING_URL --body https://<service>.onrender.com"
            exit 1
          fi
          case "$SIGNALING_URL" in
            https://*) ;;
            *) echo "::error::SIGNALING_URL must be https:// — Pages is served over TLS and a browser blocks a ws:// upgrade from a secure page as mixed content."; exit 1 ;;
          esac

          mkdir -p _site
          cp -R widget/demo _site/demo
          cp -R widget/dist _site/dist
          printf 'window.SS_SIGNALING = "%s";\n' "$SIGNALING_URL" > _site/demo/config.js

          # Bare /screenshare/ should land somewhere useful. The demo page mints
          # a fresh room id when none is supplied, so this is a working entry.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>screen-share demo</title>
          <meta http-equiv="refresh" content="0; url=./demo/index.html">
          <p><a href="./demo/index.html">screen-share demo</a></p>
          HTML

      # Re-running this workflow is the obvious thing to do when a deploy fails,
      # and it breaks the next attempt: every attempt uploads another artifact
      # named github-pages, they all persist under the same run id, and
      # deploy-pages refuses when it finds more than one —
      #   Error: Multiple artifacts named "github-pages" were unexpectedly found
      #   for this workflow run. Artifact count is 3.
      # Clearing the old ones first makes "Re-run jobs" work like people expect.
      - name: clear artifacts from earlier attempts of this run
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                  --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $ids; do
            echo "deleting stale github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      # A deploy that times out leaves its deployment wedged "in progress", and
      # the wedged one then rejects the next run outright:
      #   HttpError: Deployment request failed for <sha> due to in progress
      #   deployment. Please cancel <other sha> first or wait for it to complete.
      # So one queue stall poisons every run after it until someone cancels by
      # hand. Clearing stragglers first turns that into a self-healing retry.
      #
      # Safe here because this site deploys only from main and the concurrency
      # group keeps runs serial — the only thing this can cancel is a leftover.
      - name: cancel wedged Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" \
            --jq '.[] | "\(.id) \(.sha)"' | while read -r id sha; do
              # Never touch this run's own deployment. Declaring
              # `environment: github-pages` makes GitHub open a deployment record
              # in_progress the moment the job starts, so an unqualified sweep
              # cancels the deploy it is about to perform and then waits ten
              # minutes on something it killed itself.
              if [ "$sha" = "${{ github.sha }}" ]; then
                continue
              fi
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
                        --jq '.[0].state // "none"' 2>/dev/null || echo none)
              case "$state" in
                in_progress|queued|pending)
                  echo "cancelling wedged deployment ${sha:0:7} (state: $state)"
                  gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" \
                    >/dev/null 2>&1 || echo "  (already gone)"
                  ;;
              esac
            done

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with: { path: _site }
      # No retry step here, though the obvious shape of one is tempting. A Pages
      # deployment is identified by the commit sha, so a second attempt in the
      # same run recreates the identity the first attempt just cancelled and is
      # killed within seconds:
      #   Created deployment for 5559734…, ID: 5559734…
      #   ##[error]Deployment cancelled.
      # Recovery is a fresh run, not a retry inside this one.
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

      - name: explain a failed deploy
        if: failure() && steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Deploy failed — usually a stall in GitHub's deployment queue."
          echo "The build and artifact are fine. A failed deploy publishes nothing, so the"
          echo "live site still serves the last successful deploy rather than a half-update."
          echo "Recover by re-running this workflow; stale artifacts are cleared automatically."
