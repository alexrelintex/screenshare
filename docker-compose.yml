services:
  signaling:
    build: ./server
    ports: ["${SIGNALING_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  static:
    build: ./widget
    ports: ["${STATIC_PORT:-5173}:5173"]
    depends_on:
      signaling:
        condition: service_healthy

# Note on ports: both are published to the HOST, not wired container-to-container.
# The browser is the client for both, so it resolves them from the host's
# perspective (127.0.0.1). Unlike a server-to-server call, using a compose
# service name here would break — the browser cannot resolve `signaling`.
